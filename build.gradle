buildscript {
    repositories { maven { url = 'https://maven.minecraftforge.net/' } }
    dependencies { classpath 'org.spongepowered:mixingradle:0.7.38' }
}

plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
apply plugin: 'org.spongepowered.mixin'

group = 'dev.mpthlee.allthetweaks'
version = '0.2.0'
def tweakMixinConfigs = ['allthetweaks_gregedition.waystones.mixins.json', 'allthetweaks_gregedition.broom.mixins.json']
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
def forgeVersion = providers.gradleProperty('forgeVersion').getOrElse('47.3.0')
def balmVersion = providers.gradleProperty('balmVersion').getOrElse('7.3.38')
def withoutOptionalMods = providers.gradleProperty('withoutOptionalMods').isPresent() || providers.gradleProperty('withoutWaystones').isPresent()
def gameTestDir = file('run-gametest/' + (withoutOptionalMods
        ? 'without-optional-mods' : 'with-optional-mods'))

sourceSets {
    gametest {
        if (withoutOptionalMods) {
            java.setSrcDirs(['src/smoke/java'])
        }
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
            property 'forge.logging.console.level', 'info'
            mods {
                allthetweaks_gregedition { source sourceSets.main }
            }
        }
        server { args '--nogui' }
        client {}
        gameTestServer {
            workingDirectory gameTestDir
            property 'forge.enabledGameTestNamespaces', 'allthetweaks_gregedition'
            mods {
                allthetweaks_gregedition { source sourceSets.gametest }
            }
        }
    }
}

repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-${forgeVersion}"
    compileOnly fg.deobf('maven.modrinth:waystones:14.1.21+forge-1.20.1')
    compileOnly fg.deobf("maven.modrinth:balm:${balmVersion}+forge-1.20.1")
    compileOnly fg.deobf('maven.modrinth:evilcraft:1.20.1-1.3.5')
    compileOnly fg.deobf('maven.modrinth:cyclops-core:1.20.1-1.22.3')
    if (!withoutOptionalMods) {
        runtimeOnly fg.deobf('maven.modrinth:waystones:14.1.21+forge-1.20.1')
        runtimeOnly fg.deobf("maven.modrinth:balm:${balmVersion}+forge-1.20.1")
        runtimeOnly fg.deobf('maven.modrinth:evilcraft:1.20.1-1.3.5')
        runtimeOnly fg.deobf('maven.modrinth:cyclops-core:1.20.1-1.22.3')
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'allthetweaks_gregedition.refmap.json'
    tweakMixinConfigs.each { config it }
}

tasks.named('jar', Jar) {
    manifest.attributes('MixinConfigs': tweakMixinConfigs.join(','))
    finalizedBy 'reobfJar'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.register('prepareTweakRegressionConfig') {
    doLast {
        // Only generated regression worlds live here; never reuse a modded world for the optional-mod test.
        delete new File(gameTestDir, 'world')
        def configFile = new File(gameTestDir, 'config/waystones-common.toml')
        configFile.parentFile.mkdirs()
        configFile.text = '''[restrictions]
generatedWaystonesUnbreakable = true
restrictToCreative = false
'''
        new File(gameTestDir, 'config/allthetweaks_gregedition-common.toml').text =
                "[tweaks]\nwaystoneProtection = ${providers.gradleProperty('protectionEnabled').getOrElse('true')}\nbroomFlightCleanup = ${providers.gradleProperty('broomFlightEnabled').getOrElse('true')}\n"
    }
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn 'prepareTweakRegressionConfig'
    doLast {
        def log = new File(gameTestDir, 'logs/latest.log').text
        def expected = sourceSets.gametest.allJava.files.sum { it.text.count('@GameTest(') }
        if (!expected || !log.contains("All ${expected} required tests passed")) {
            throw new GradleException("Expected ${expected} passing GameTests; inspect ${gameTestDir}/logs/latest.log")
        }
    }
}
