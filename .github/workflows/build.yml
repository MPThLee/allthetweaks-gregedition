name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Run regression and compatibility checks
        run: sh scripts/verify.sh
      - name: Package release JAR
        shell: bash
        run: |
          # Restore the default Forge build after the compatibility runs.
          ./gradlew build --console=plain
          jars=(build/libs/*.jar)
          test "${#jars[@]}" -eq 1
          test -f "${jars[0]}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$(basename "${jars[0]}")" = "allthetweaks-gregedition-${GITHUB_REF_NAME#v}.jar" || {
              echo 'Release tag must be v followed by the version in build.gradle.' >&2
              exit 1
            }
          fi
          mkdir -p build/release
          cp "${jars[0]}" build/release/
          cd build/release
          sha256sum ./*.jar > SHA256SUMS.txt
      - name: Upload JAR and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-jar
          path: build/release/
          if-no-files-found: error
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-logs
          path: |
            build/reports/verification/
            run-gametest/**/logs/
            run-gametest/**/crash-reports/
          if-no-files-found: warn
          retention-days: 14

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-jar
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          cd release
          sha256sum --check SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" ./*.jar SHA256SUMS.txt \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
